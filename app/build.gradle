import java.security.KeyStore
import java.security.MessageDigest

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def EXPECTED_SHA256 = 'd3b5a5b96a3dc8b01188aa308ca127618ef80ba6b84eabb6925259bba2f8e022'

if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
    def storeFile = rootProject.file(keystoreProps['storeFile'])
    def storePass = keystoreProps['storePassword']
    def keyAlias = keystoreProps['keyAlias']
    def ks = null
    ['JKS', 'PKCS12'].each { type ->
        if (ks == null) {
            try {
                def candidate = KeyStore.getInstance(type)
                candidate.load(new FileInputStream(storeFile), storePass.toCharArray())
                ks = candidate
            } catch (Exception ignored) {
            }
        }
    }
    if (ks == null) {
        throw new GradleException('Keystore tidak bisa dibaca. Hubungi maintainer rilis.')
    }
    def cert = ks.getCertificate(keyAlias)
    if (cert == null) {
        throw new GradleException('Alias kunci tidak ditemukan. Hubungi maintainer rilis.')
    }
    def hex = MessageDigest.getInstance('SHA-256').digest(cert.encoded)
        .collect { String.format('%02x', it & 0xff) }.join()
    if (hex != EXPECTED_SHA256) {
        throw new GradleException("Kunci rilis tidak cocok ($hex). Hubungi maintainer rilis.")
    }
}

android {
    namespace 'com.sahabatmobile.chat'
    compileSdk 36

    defaultConfig {
        applicationId "com.sahabatmobile.chat"
        minSdk 26
        targetSdk 36
        versionCode 18
        versionName "1.2.15"
    }

    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.google.code.gson:gson:2.10.1'
}

// Build release dijalankan oleh pipeline rilis resmi.
tasks.matching { it.name.startsWith('assembleRelease') || it.name.startsWith('bundleRelease') }
    .configureEach {
        doFirst {
            if (!keystorePropsFile.exists()) {
                throw new GradleException(
                    'Build release lokal dinonaktifkan. Naikkan versi lalu push tag vX.Y.Z.'
                )
            }
        }
    }
